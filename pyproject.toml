[project]
name = "subtitle-grabber"
version = "0.1.0"
description = "Download YouTube subtitles from the terminal, on Windows, macOS, or Linux."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "yt-dlp",
    "windows-curses; platform_system == 'Windows'",
]

[project.scripts]
subgrabber = "tui:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["subtitle_grabber", "tui"]
